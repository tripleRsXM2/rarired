<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: lets safe-area-inset-* paint into the iOS notch
         and bottom-bar regions instead of leaving a black strip.
         interactive-widget=resizes-content: Android Chrome resizes the
         layout when the keyboard opens instead of overlaying it (stops
         the "have to resize the window" experience the user reported).
         maximum-scale=1.0 + user-scalable=no: locks pinch-zoom when
         the site runs as an installed PWA (display:standalone,
         launched from Home Screen). iOS Safari deliberately IGNORES
         these flags in a regular browser tab for accessibility, so
         users browsing the URL can still zoom — only the installed
         app feels "native" with the lock. Same on Android Chrome in
         standalone mode. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>CourtSync</title>

    <!-- Favicon (browser tab) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Editorial Tennis design system fonts (per design-handoff).
         Space Grotesk = display (tile titles, hero numerals).
         Sora           = body / greetings.
         JetBrains Mono = uppercase microlabels + nav. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA manifest — lets Android Chrome offer "Add to Home Screen"
         and lets iOS install with the right name/icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme + iOS PWA chrome. apple-touch-icon is what iOS actually
         uses for the Home Screen icon (manifest icons are ignored by
         iOS Safari for installation). apple-mobile-web-app-capable +
         status-bar-style let the standalone PWA paint into the notch
         area like a native app. -->
    <meta name="theme-color" content="#0c1124" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CourtSync" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
